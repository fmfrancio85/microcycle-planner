<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Microcycle Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: scoreboard-style header and week totals, then the Sat→Sat week as a wrapping grid of day cards (8 across on a projector, 1 column on a phone). */
:root{
  --bg:#edf2f8; --surface:#ffffff; --surface-2:#f2f6fb; --ink:#14202e; --muted:#55667a; --line:#d2dce8;
  --accent:#1763c4; --accent-ink:#ffffff; --accent-soft:#dcecfb;
  --match-bg:#0f2f5c; --match-ink:#eaf3fd; --match-tag:#8ccbf7; --match-tag-ink:#0b2445;
  --off:#8793a3; --danger:#b3261e; --danger-soft:#fbe9e7; --ok:#1763c4;
  --shadow:0 20px 60px rgba(9,18,32,.28);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b121b; --surface:#131c28; --surface-2:#1a2534; --ink:#e6edf5; --muted:#93a3b6; --line:#273447;
  --accent:#6fb8f6; --accent-ink:#07121f; --accent-soft:#15304d;
  --match-bg:#1a4a86; --match-ink:#eef5fd; --match-tag:#9ad3fa; --match-tag-ink:#0b2445;
  --off:#6c7a8c; --danger:#f2867f; --danger-soft:#3b1f1d; --ok:#6fb8f6;
  --shadow:0 20px 60px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b121b; --surface:#131c28; --surface-2:#1a2534; --ink:#e6edf5; --muted:#93a3b6; --line:#273447;
  --accent:#6fb8f6; --accent-ink:#07121f; --accent-soft:#15304d;
  --match-bg:#1a4a86; --match-ink:#eef5fd; --match-tag:#9ad3fa; --match-tag-ink:#0b2445;
  --off:#6c7a8c; --danger:#f2867f; --danger-soft:#3b1f1d; --ok:#6fb8f6;
  --shadow:0 20px 60px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1880px;margin:0 auto;padding-block:20px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px}
.brand h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,4vw,40px);letter-spacing:.01em;line-height:1;margin:0;text-transform:uppercase;text-wrap:balance}
.brand p{margin:6px 0 0;color:var(--muted);font-size:14px;max-width:60ch}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.group{display:flex;align-items:center;gap:8px}
.group label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:42px;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#groupName{width:190px}
button{font:inherit;cursor:pointer;border-radius:8px;min-height:42px;padding:0 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500}
button:hover{border-color:var(--muted)}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn-primary:hover{filter:brightness(1.07);border-color:var(--accent)}
.btn-danger{color:var(--danger)}
.btn-danger-solid{background:var(--danger);color:var(--surface);border-color:var(--danger);font-weight:600}
.sep{width:1px;height:28px;background:var(--line)}

.notice{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:var(--radius);padding:10px 14px;font-size:14px}

.totals{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:baseline;padding:2px 2px 0}
.total{display:flex;align-items:baseline;gap:8px}
.total b{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.total span{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:12px;align-items:start}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);display:grid;min-width:0}
.day-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.dow{font-family:var(--display);font-weight:700;font-size:26px;text-transform:uppercase;line-height:1}
.tag{font-family:var(--mono);font-size:13px;font-weight:500;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums}
.day.match{background:var(--match-bg);color:var(--match-ink);border-color:transparent}
.day.match .day-head{border-color:transparent}
.day.match .tag{background:var(--match-tag);color:var(--match-tag-ink)}
.match-body{padding:14px 14px 26px;text-align:center}
.match-body strong{display:block;font-family:var(--display);font-size:30px;letter-spacing:.06em;text-transform:uppercase}
.match-body span{font-size:13px;opacity:.8}
.drills{list-style:none;margin:0;padding:10px;display:grid;gap:8px;align-content:start}
.drill{background:var(--surface-2);border-radius:8px;padding:9px 10px 4px;display:grid;gap:3px;min-width:0}
.drill-top{display:flex;gap:8px;align-items:baseline}
.ord{font-family:var(--mono);font-size:12px;color:var(--muted)}
.drill-name{font-weight:600;font-size:14px;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.drill-meta{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.drill-actions{display:flex;justify-content:flex-end;gap:2px;margin-right:-6px}
.icon-btn{min-height:34px;min-width:34px;padding:0 7px;font-size:13px;border-color:transparent;background:transparent;color:var(--muted)}
.icon-btn:hover:not(:disabled){background:var(--surface);border-color:var(--line);color:var(--ink)}
.icon-btn svg{display:block;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.empty{color:var(--muted);font-size:13px;padding:10px 4px}
.day-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;border-top:1px solid var(--line)}
.count{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.add{min-height:38px;font-size:14px}
.off-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.day.off .off-row{border-bottom:none}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.switch input{width:18px;height:18px;min-height:0;accent-color:var(--accent)}
.off-label{font-family:var(--display);font-size:24px;letter-spacing:.08em;color:var(--off);text-transform:uppercase;text-align:center;padding:10px 0 24px}

dialog{border:none;border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(580px,calc(100vw - 24px));max-height:calc(100vh - 24px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(9,18,32,.6)}
dialog.small{width:min(420px,calc(100vw - 24px))}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-head h2{margin:0;font-family:var(--display);font-size:24px;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.dlg-body{padding:16px 18px;display:grid;gap:14px;overflow-y:auto;max-height:calc(100vh - 170px)}
.dlg-body p{margin:0}
.dlg-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
.field{display:grid;gap:5px;min-width:0}
.field>label,.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:var(--muted)}
.hint{color:var(--muted);font-size:13px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:36px;padding:0 11px;font-family:var(--mono);font-size:12px;border-radius:999px;background:var(--surface-2)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-width:44px;font-family:var(--mono)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dims{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.dims span{font-family:var(--mono);color:var(--muted)}
.link-btn{border:none;background:none;color:var(--accent);padding:0;min-height:36px;font-weight:600;justify-self:start}
.pitch-block{display:grid;gap:14px}
.error{color:var(--danger);font-size:13px}
.preview-line{font-family:var(--mono);font-size:13px;background:var(--surface-2);border-radius:8px;padding:9px 10px;overflow-wrap:anywhere}

.drill-note{font-size:13px;color:var(--ink);opacity:.85;overflow-wrap:anywhere;border-left:2px solid var(--line);padding-left:8px;margin-top:3px}
.btn-icon{display:inline-flex;align-items:center;gap:8px}
.btn-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-left:auto}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--off);display:inline-block}
.sync.done i{background:var(--ok)}
.sync.done{color:var(--ink)}
.counter{font-family:var(--mono);font-size:12px;color:var(--muted);justify-self:end}
#fNote{min-height:64px;resize:vertical}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 10px 8px 18px;display:flex;align-items:center;gap:12px;font-size:14px;max-width:calc(100vw - 32px);box-shadow:var(--shadow);z-index:40}
.toast button{min-height:34px;background:transparent;color:inherit;border-color:currentColor;border-radius:999px;font-weight:600}
.toast.plain{padding-right:18px;padding-block:12px}
.csv-out{width:100%;min-height:150px;font-family:var(--mono);font-size:12px}
@media (max-width:460px){#groupName{width:100%}.group{width:100%}.row{grid-template-columns:1fr}.sep{display:none}.tools button{flex:1 1 auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Microcycle Planner</h1>
      <p>One match week, Saturday to Saturday. Plan up to 4 drills on each training day, then upload your week.</p>
    </div>
    <div class="tools">
      <div class="group">
        <label for="groupName">Group</label>
        <input id="groupName" type="text" placeholder="e.g. Group 3" autocomplete="off" maxlength="40">
      </div>
      <span class="sep" aria-hidden="true"></span>
      <button id="uploadBtn" type="button" class="btn-primary btn-icon"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 13V3M5.5 7.5 10 3l4.5 4.5M3.5 13v2.5a1.5 1.5 0 0 0 1.5 1.5h10a1.5 1.5 0 0 0 1.5-1.5V13"/></svg><span id="uploadLbl">Upload</span></button>
      <button id="downloadBtn" type="button" hidden>Download CSV</button>
      <span class="sep" aria-hidden="true"></span>
      <button id="exampleBtn" type="button">Load example</button>
      <button id="resetBtn" type="button" class="btn-danger">Reset week</button>
    </div>
  </header>

  <div id="exampleNotice" class="notice" hidden>
    <span>This is an example week. Clear it to plan your own.</span>
    <button id="startBtn" type="button" class="btn-primary">Start my week</button>
  </div>

  <div class="totals" id="totals" aria-live="polite"></div>
  <section id="week" class="week" aria-label="Week plan"></section>
</div>

<!-- Drill form -->
<dialog id="drillDialog" aria-labelledby="dlgTitle">
  <form id="drillForm" novalidate>
    <div class="dlg-head">
      <h2 id="dlgTitle">Add drill</h2>
      <button type="button" class="icon-btn" data-close aria-label="Close">✕</button>
    </div>
    <div class="dlg-body">
      <div class="field">
        <label for="fType">Drill</label>
        <select id="fType" required></select>
      </div>
      <div class="field" id="presetField">
        <span class="lbl">Quick fill</span>
        <div class="chips" id="presets"></div>
      </div>
      <button type="button" class="link-btn" id="showPitch" hidden>+ Add players and pitch</button>
      <div class="pitch-block" id="pitchBlock">
        <div class="row">
          <div class="field">
            <label for="fTeamA">Players team A</label>
            <input id="fTeamA" type="number" inputmode="numeric" min="1" max="15" placeholder="optional">
          </div>
          <div class="field">
            <label for="fTeamB">Players team B</label>
            <input id="fTeamB" type="number" inputmode="numeric" min="1" max="15" placeholder="optional">
          </div>
        </div>
        <div class="row">
          <div class="field">
            <span class="lbl" id="gkLbl">Goalkeepers</span>
            <div class="seg" id="fGk" role="group" aria-labelledby="gkLbl"></div>
          </div>
          <div class="field">
            <span class="lbl" id="goalLbl">Goals</span>
            <div class="seg" id="fGoals" role="group" aria-labelledby="goalLbl"></div>
          </div>
        </div>
        <div class="field">
          <span class="lbl">Pitch size, length × width (m)</span>
          <div class="dims">
            <input id="fLength" type="number" inputmode="numeric" min="5" max="120" placeholder="Length" aria-label="Pitch length in metres">
            <span>×</span>
            <input id="fWidth" type="number" inputmode="numeric" min="5" max="90" placeholder="Width" aria-label="Pitch width in metres">
          </div>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="fSeries">Series</label>
          <input id="fSeries" type="number" inputmode="numeric" min="1" max="20" required>
        </div>
        <div class="field">
          <label for="fMinutes">Minutes per series</label>
          <input id="fMinutes" type="number" inputmode="decimal" min="0.5" max="90" step="0.5" required>
        </div>
      </div>
      <div class="field">
        <label for="fNote">Comment (optional)</label>
        <textarea id="fNote" maxlength="200" placeholder="e.g. 2 touches, wide players high, 1' rest between series"></textarea>
        <span class="counter" id="noteCount">0/200</span>
      </div>
      <div class="preview-line" id="formPreview" aria-live="polite"></div>
      <div class="error" id="formError" role="alert"></div>
    </div>
    <div class="dlg-foot">
      <button type="button" data-close>Cancel</button>
      <button type="submit" class="btn-primary">Save drill</button>
    </div>
  </form>
</dialog>

<!-- Confirm / CSV fallback -->
<dialog id="confirmDialog" class="small" aria-labelledby="cfTitle">
  <div class="dlg-head"><h2 id="cfTitle"></h2></div>
  <div class="dlg-body"><p id="cfText"></p><textarea id="cfCsv" class="csv-out" readonly hidden></textarea></div>
  <div class="dlg-foot">
    <button type="button" id="cfCancel">Cancel</button>
    <button type="button" id="cfOk" class="btn-danger-solid"></button>
  </div>
</dialog>

<div id="toast" class="toast" role="status" hidden><span id="toastMsg"></span><button type="button" id="toastUndo">Undo</button></div>

<script>
/*PURE-START*/
const DRILL_GROUPS=[
  ["Preparation",["Warm Up","Coordination","Injury prevention"]],
  ["Physical",["Strength","Speed Agility","Endurance"]],
  ["Technical",["Technical work","Passing drill","Finishing"]],
  ["Tactical",["Line Work / Positional Work (Tactical)","Building Up","Set pieces"]],
  ["Games",["Possession Game","SSG","LSG"]]
];
const DRILL_TYPES=DRILL_GROUPS.flatMap(g=>g[1]);
const NO_PITCH=new Set(["Warm Up","Coordination","Injury prevention","Strength","Speed Agility","Endurance"]);
const DAYS=[
  {id:"sat1",dow:"Sat",tag:"MD",match:true},
  {id:"sun",dow:"Sun",tag:"MD+1"},
  {id:"mon",dow:"Mon",tag:"MD+2",offable:true},
  {id:"tue",dow:"Tue",tag:"MD-4"},
  {id:"wed",dow:"Wed",tag:"MD-3"},
  {id:"thu",dow:"Thu",tag:"MD-2"},
  {id:"fri",dow:"Fri",tag:"MD-1"},
  {id:"sat2",dow:"Sat",tag:"MD",match:true}
];
const TRAIN_DAYS=DAYS.filter(d=>!d.match);
const MAX=4;
const CSV_HEAD=["group","day","day_tag","drill_order","drill","players_team_a","players_team_b","goalkeepers","goals","pitch_length_m","pitch_width_m","series","minutes_per_series","total_minutes","comment"];

function fmtMin(m){return (Math.round(m*10)/10).toString();}
function emptyState(group){const s={group:group||"",monOn:false,example:false,drills:{}};TRAIN_DAYS.forEach(d=>s.drills[d.id]=[]);return s;}
function summary(x){
  const p=[];
  if(x.teamA) p.push(x.teamB?x.teamA+"v"+x.teamB:x.teamA+" players");
  if(x.gk) p.push(x.gk+" GK");
  if(x.goals) p.push(x.goals+(x.goals>1?" goals":" goal"));
  if(x.length&&x.width) p.push(x.length+"×"+x.width+" m");
  if(x.series&&x.minutes) p.push(x.series+"×"+fmtMin(x.minutes)+"′");
  return p.join(" · ");
}
function dayActive(state,day){return !(day.offable&&!state.monOn);}
function weekTotals(state){
  let sessions=0,drills=0,minutes=0;
  TRAIN_DAYS.forEach(d=>{if(!dayActive(state,d))return;const l=state.drills[d.id];if(l.length)sessions++;drills+=l.length;l.forEach(x=>minutes+=x.series*x.minutes);});
  return {sessions,drills,minutes};
}
function toCsv(state){
  const q=v=>{if(v===null||v===undefined)return"";const s=String(v).replace(/\s*\n\s*/g," ");return /[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const rows=[CSV_HEAD.join(",")];
  TRAIN_DAYS.forEach(day=>{
    if(!dayActive(state,day))return;
    state.drills[day.id].forEach((x,i)=>rows.push([state.group,day.dow,day.tag,i+1,x.type,x.teamA,x.teamB,x.gk,x.goals,x.length,x.width,x.series,x.minutes,Math.round(x.series*x.minutes*10)/10,x.note||""].map(q).join(",")));
  });
  return rows.join("\n");
}
function uploadRows(state){
  const rows=[];
  TRAIN_DAYS.forEach(day=>{
    if(!dayActive(state,day))return;
    state.drills[day.id].forEach((x,i)=>rows.push({day:day.dow,day_tag:day.tag,drill_order:i+1,drill:x.type,players_team_a:x.teamA,players_team_b:x.teamB,goalkeepers:x.gk,goals:x.goals,
      pitch_length_m:x.length,pitch_width_m:x.width,series:x.series,minutes_per_series:x.minutes,total_minutes:Math.round(x.series*x.minutes*10)/10,comment:x.note||""}));
  });
  return rows;
}
/*PURE-END*/

(function(){
  const KEY="microcycle-planner-v1";
  // Address of the Google Apps Script web app that writes uploads into the instructor's Google Sheet.
  const UPLOAD_URL="https://script.google.com/macros/s/AKfycbx8pQIF-_k-cybjoTAUMYxV3d-S4YWwFgn286BCme6eIYJHtPxd-p3OUwH5Evg0uruH/exec";
  const EMBEDDED=(()=>{try{return window.self!==window.top;}catch(e){return true;}})();
  const PRESETS=[
    {label:"Rondo 5v2 · 12×12",v:{type:"Possession Game",teamA:5,teamB:2,gk:0,goals:0,length:12,width:12,series:4,minutes:2}},
    {label:"4v4+GK · 40×30",v:{type:"SSG",teamA:4,teamB:4,gk:2,goals:2,length:40,width:30,series:4,minutes:4}},
    {label:"7v7+GK · 60×45",v:{type:"SSG",teamA:7,teamB:7,gk:2,goals:2,length:60,width:45,series:3,minutes:6}},
    {label:"10v10+GK · 84×60",v:{type:"LSG",teamA:10,teamB:10,gk:2,goals:2,length:84,width:60,series:2,minutes:8}}
  ];
  const ICON={
    up:'<svg viewBox="0 0 16 16"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg>',
    down:'<svg viewBox="0 0 16 16"><path d="M8 3v10M3.5 8.5 8 13l4.5-4.5"/></svg>',
    copy:'<svg viewBox="0 0 16 16"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 5.5v-2a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2"/></svg>',
    edit:'<svg viewBox="0 0 16 16"><path d="M2.5 13.5l.6-3L10.6 3l2.4 2.4-7.5 7.5-3 .6zM9 4.6 11.4 7"/></svg>',
    del:'<svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>'
  };
  const mk=(type,a,b,gk,goals,len,wid,series,min)=>({type,teamA:a,teamB:b,gk,goals,length:len,width:wid,series,minutes:min});
  function exampleState(){
    const s=emptyState("Example");s.example=true;
    s.drills.sun=[mk("Warm Up",null,null,0,0,null,null,1,15),mk("Technical work",null,null,0,0,null,null,1,15)];
    s.drills.tue=[mk("Warm Up",null,null,0,0,null,null,1,15),mk("Possession Game",6,6,0,0,35,30,3,5),Object.assign(mk("SSG",4,4,2,2,40,30,4,4),{note:"2 touches max, 2' rest between series"}),mk("Finishing",4,2,1,1,40,50,1,15)];
    s.drills.wed=[mk("Warm Up",null,null,0,0,null,null,1,15),mk("Building Up",8,6,1,1,70,50,2,10),Object.assign(mk("LSG",10,10,2,2,84,60,2,8),{note:"Match rules, high press after a lost ball"})];
    s.drills.thu=[mk("Warm Up",null,null,0,0,null,null,1,12),mk("Passing drill",null,null,0,0,null,null,1,15),mk("Line Work / Positional Work (Tactical)",10,null,1,1,52,68,2,10)];
    s.drills.fri=[mk("Warm Up",null,null,0,0,null,null,1,10),mk("Set pieces",11,11,2,2,null,null,1,20)];
    return s;
  }

  let state=null;
  try{const raw=localStorage.getItem(KEY);if(raw)state=JSON.parse(raw);}catch(e){}
  if(!state||typeof state!=="object"||!state.drills) state=exampleState();
  TRAIN_DAYS.forEach(d=>{if(!Array.isArray(state.drills[d.id]))state.drills[d.id]=[];});
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

  const $=s=>document.querySelector(s);
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const num=v=>(v===null||v===undefined||v==="")?null:Number(v);
  const week=$("#week");

  // Toast with optional undo
  let undoSnap=null,toastT;
  function toast(msg,snap){
    undoSnap=snap||null;
    $("#toastMsg").textContent=msg;$("#toastUndo").hidden=!snap;
    $("#toast").classList.toggle("plain",!snap);$("#toast").hidden=false;
    clearTimeout(toastT);toastT=setTimeout(()=>{$("#toast").hidden=true;undoSnap=null;},snap?7000:3200);
  }
  $("#toastUndo").addEventListener("click",()=>{if(!undoSnap)return;state=JSON.parse(undoSnap);undoSnap=null;save();render();toast("Restored.");});
  const snap=()=>JSON.stringify(state);

  function open(d){if(typeof d.showModal==="function")d.showModal();else d.setAttribute("open","");}
  document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>b.closest("dialog").close()));

  function confirmBox(title,text,okLabel){
    return new Promise(res=>{
      const d=$("#confirmDialog");
      $("#cfTitle").textContent=title;$("#cfText").textContent=text;$("#cfCsv").hidden=true;
      $("#cfOk").textContent=okLabel;$("#cfOk").hidden=false;$("#cfCancel").textContent="Cancel";
      const done=v=>{d.close();$("#cfOk").onclick=null;$("#cfCancel").onclick=null;d.oncancel=null;res(v);};
      $("#cfOk").onclick=()=>done(true);$("#cfCancel").onclick=()=>done(false);d.oncancel=()=>res(false);
      open(d);
    });
  }

  function syncHtml(){
    if(!state.uploadedAt) return "";
    const same=state.uploadedCsv===toCsv(state),d=new Date(state.uploadedAt);
    const hh=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
    return same?`<div class="sync done"><i></i>Uploaded at ${hh}</div>`:`<div class="sync"><i></i>Changed since the upload at ${hh}. Upload again to update it.</div>`;
  }
  function render(){
    if(document.activeElement!==$("#groupName")) $("#groupName").value=state.group||"";
    $("#exampleNotice").hidden=!state.example;
    const t=weekTotals(state);
    $("#totals").innerHTML=`<div class="total"><b>${t.sessions}</b><span>training days</span></div><div class="total"><b>${t.drills}</b><span>drills</span></div><div class="total"><b>${fmtMin(t.minutes)}′</b><span>planned on pitch</span></div>${syncHtml()}`;
    week.innerHTML="";
    DAYS.forEach(day=>{
      const card=document.createElement("article");card.className="day";
      const head=`<div class="day-head"><span class="dow">${day.dow}</span><span class="tag">${day.tag}</span></div>`;
      if(day.match){
        card.classList.add("match");
        card.innerHTML=head+`<div class="match-body"><strong>Match</strong><span>${day.id==="sat1"?"Previous match":"Next match"}</span></div>`;
        week.appendChild(card);return;
      }
      const active=dayActive(state,day),list=state.drills[day.id];
      const toggle=day.offable?`<div class="off-row"><span>${active?"Training day":"Rest day"}</span><label class="switch"><input type="checkbox" id="monToggle" ${state.monOn?"checked":""}> Train</label></div>`:"";
      if(!active){card.classList.add("off");card.innerHTML=head+toggle+`<div class="off-label">Day off</div>`;week.appendChild(card);return;}
      const total=list.reduce((a,x)=>a+x.series*x.minutes,0),full=list.length>=MAX;
      const items=list.length?list.map((x,i)=>`
        <li class="drill">
          <div class="drill-top"><span class="ord">${i+1}</span><span class="drill-name">${esc(x.type)}</span></div>
          <div class="drill-meta">${esc(summary(x))}</div>${x.note?`<div class="drill-note">${esc(x.note)}</div>`:""}
          <div class="drill-actions">
            <button type="button" class="icon-btn" data-act="up" data-day="${day.id}" data-i="${i}" ${i===0?"disabled":""} aria-label="Move ${esc(x.type)} up">${ICON.up}</button>
            <button type="button" class="icon-btn" data-act="down" data-day="${day.id}" data-i="${i}" ${i===list.length-1?"disabled":""} aria-label="Move ${esc(x.type)} down">${ICON.down}</button>
            <button type="button" class="icon-btn" data-act="dup" data-day="${day.id}" data-i="${i}" ${full?"disabled":""} aria-label="Duplicate ${esc(x.type)}">${ICON.copy}</button>
            <button type="button" class="icon-btn" data-act="edit" data-day="${day.id}" data-i="${i}" aria-label="Edit ${esc(x.type)}">${ICON.edit}</button>
            <button type="button" class="icon-btn" data-act="del" data-day="${day.id}" data-i="${i}" aria-label="Delete ${esc(x.type)}">${ICON.del}</button>
          </div>
        </li>`).join(""):`<li class="empty">No drills yet.</li>`;
      card.innerHTML=head+toggle+`<ol class="drills">${items}</ol>
        <div class="day-foot"><span class="count">${list.length}/${MAX} · ${fmtMin(total)}′</span>
        <button type="button" class="add btn-primary" data-act="add" data-day="${day.id}" ${full?"disabled":""}>${full?"Day full":"+ Add drill"}</button></div>`;
      week.appendChild(card);
    });
    const mt=$("#monToggle");
    if(mt) mt.addEventListener("change",()=>{state.monOn=mt.checked;state.example=false;save();render();});
  }

  // Drill form
  const dlg=$("#drillDialog"),form=$("#drillForm"),fType=$("#fType");
  fType.innerHTML=`<option value="">Choose a drill…</option>`+DRILL_GROUPS.map(g=>`<optgroup label="${g[0]}">${g[1].map(t=>`<option>${esc(t)}</option>`).join("")}</optgroup>`).join("");
  function seg(el,max,name){for(let i=0;i<=max;i++){const b=document.createElement("button");b.type="button";b.textContent=i;b.dataset.v=i;b.id=name+"-"+i;b.addEventListener("click",()=>{setSeg(el,i);preview();});el.appendChild(b);}}
  function setSeg(el,v){el.dataset.value=v;[...el.children].forEach(b=>b.setAttribute("aria-pressed",String(Number(b.dataset.v)===v)));}
  seg($("#fGk"),2,"gk");seg($("#fGoals"),4,"goals");
  PRESETS.forEach(p=>{const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=p.label;b.addEventListener("click",()=>{fill(p.v);showPitch(true);preview();$("#fSeries").focus();});$("#presets").appendChild(b);});
  function showPitch(on){$("#pitchBlock").hidden=!on;$("#showPitch").hidden=on;}
  $("#showPitch").addEventListener("click",()=>{showPitch(true);$("#fTeamA").focus();});
  function fill(x){
    fType.value=x.type||"";
    $("#fTeamA").value=x.teamA!=null?x.teamA:"";$("#fTeamB").value=x.teamB!=null?x.teamB:"";
    setSeg($("#fGk"),x.gk||0);setSeg($("#fGoals"),x.goals||0);
    $("#fLength").value=x.length!=null?x.length:"";$("#fWidth").value=x.width!=null?x.width:"";
    $("#fSeries").value=x.series!=null?x.series:"";$("#fMinutes").value=x.minutes!=null?x.minutes:"";
    if("note" in x||!x.type) $("#fNote").value=x.note||"";
    $("#noteCount").textContent=$("#fNote").value.length+"/200";
  }
  function read(){
    const pitch=!$("#pitchBlock").hidden;
    return {type:fType.value,teamA:pitch?num($("#fTeamA").value):null,teamB:pitch?num($("#fTeamB").value):null,
      gk:pitch?Number($("#fGk").dataset.value||0):0,goals:pitch?Number($("#fGoals").dataset.value||0):0,
      length:pitch?num($("#fLength").value):null,width:pitch?num($("#fWidth").value):null,
      series:num($("#fSeries").value),minutes:num($("#fMinutes").value),note:$("#fNote").value.trim().slice(0,200)};
  }
  function preview(){const x=read();const s=summary(x);$("#formPreview").textContent=(x.type||"Drill")+(s?" · "+s:"");}
  form.addEventListener("input",()=>{preview();$("#noteCount").textContent=$("#fNote").value.length+"/200";});
  fType.addEventListener("change",()=>{
    const x=read(),hasPitch=x.teamA||x.teamB||x.gk||x.goals||x.length||x.width;
    if(NO_PITCH.has(fType.value)&&!hasPitch) showPitch(false); else if(!NO_PITCH.has(fType.value)) showPitch(true);
    preview();
  });
  let editing=null;
  function openForm(dayId,i){
    editing={dayId,i};
    const x=i!=null?state.drills[dayId][i]:null,day=DAYS.find(d=>d.id===dayId);
    $("#dlgTitle").textContent=(x?"Edit drill":"Add drill")+" · "+day.dow+" "+day.tag;
    fill(x?Object.assign({note:""},x):{type:"",gk:0,goals:0,series:1,minutes:10,note:""});
    const hasPitch=x&&(x.teamA||x.gk||x.goals||x.length);
    showPitch(!x||hasPitch||!NO_PITCH.has(x.type));
    $("#presetField").hidden=!!x;$("#formError").textContent="";preview();
    open(dlg);fType.focus();
  }
  form.addEventListener("submit",e=>{
    e.preventDefault();
    const err=$("#formError"),x=read();
    if(!x.type){err.textContent="Choose a drill.";fType.focus();return;}
    if(!x.series||x.series<1||!Number.isInteger(x.series)){err.textContent="Series must be a whole number, 1 or more.";$("#fSeries").focus();return;}
    if(!x.minutes||x.minutes<=0){err.textContent="Enter the minutes per series.";$("#fMinutes").focus();return;}
    if((x.length&&!x.width)||(!x.length&&x.width)){err.textContent="Enter both pitch length and width, or leave both empty.";return;}
    if(x.teamB&&!x.teamA){err.textContent="Fill team A before team B.";$("#fTeamA").focus();return;}
    const list=state.drills[editing.dayId];
    if(editing.i!=null) list[editing.i]=x; else if(list.length<MAX) list.push(x);
    state.example=false;save();dlg.close();render();toast("Drill saved.");
  });

  week.addEventListener("click",e=>{
    const b=e.target.closest("button[data-act]");if(!b)return;
    const day=b.dataset.day,i=b.dataset.i!=null?Number(b.dataset.i):null,list=state.drills[day],act=b.dataset.act;
    if(act==="add") return openForm(day,null);
    if(act==="edit") return openForm(day,i);
    const before=snap();
    if(act==="del"){const name=list[i].type;list.splice(i,1);state.example=false;save();render();toast(name+" deleted.",before);return;}
    if(act==="dup"&&list.length<MAX) list.splice(i+1,0,Object.assign({},list[i]));
    if(act==="up"&&i>0) [list[i-1],list[i]]=[list[i],list[i-1]];
    if(act==="down"&&i<list.length-1) [list[i+1],list[i]]=[list[i],list[i+1]];
    state.example=false;save();render();
    const sel=`button[data-act="${act}"][data-day="${day}"][data-i="${act==="up"?i-1:act==="down"?i+1:i}"]`;
    const again=week.querySelector(sel);if(again&&!again.disabled)again.focus();
  });

  $("#groupName").addEventListener("input",e=>{state.group=e.target.value;save();});

  $("#resetBtn").addEventListener("click",async()=>{
    const t=weekTotals(state);
    if(t.drills&&!state.example){const ok=await confirmBox("Reset week?","This removes all "+t.drills+" drills from the week.","Reset week");if(!ok)return;}
    const before=snap();state=emptyState(state.example?"":state.group);save();render();toast("Week cleared.",before);
  });
  $("#startBtn").addEventListener("click",()=>{state=emptyState("");save();render();$("#groupName").focus();});
  $("#exampleBtn").addEventListener("click",async()=>{
    if(weekTotals(state).drills&&!state.example){const ok=await confirmBox("Load the example?","The example replaces the week you have planned.","Load example");if(!ok)return;}
    const before=snap();state=exampleState();save();render();toast("Example week loaded.",before);
  });

  // Messages
  function infoBox(title,text){
    const d=$("#confirmDialog");
    $("#cfTitle").textContent=title;$("#cfText").textContent=text;$("#cfCsv").hidden=true;$("#cfOk").hidden=true;
    $("#cfCancel").textContent="Close";$("#cfCancel").onclick=()=>d.close();d.oncancel=null;open(d);
  }

  // Upload: sends the week to the instructor's Google Sheet. A second upload from the same device replaces the first.
  function deviceId(){
    let id=null;try{id=localStorage.getItem(KEY+"-device");}catch(e){}
    if(!id){id="d-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,10);try{localStorage.setItem(KEY+"-device",id);}catch(e){}}
    return id;
  }
  let uploading=false;
  $("#uploadBtn").addEventListener("click",async()=>{
    if(uploading)return;
    if(state.example){infoBox("This is the example week","Press \"Start my week\", plan your own drills, then upload.");return;}
    const rows=uploadRows(state);
    if(!rows.length){toast("The week is empty: add a drill first.");return;}
    if(!(state.group||"").trim()){toast("Enter your group name first.");$("#groupName").focus();return;}
    if(!UPLOAD_URL){infoBox("Upload is not connected yet",EMBEDDED?"This preview cannot send data. Upload works from the classroom link once the instructor has connected the Google Sheet.":"The instructor has not connected the Google Sheet yet.");return;}
    uploading=true;$("#uploadBtn").disabled=true;$("#uploadLbl").textContent="Uploading…";
    const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),25000);
    try{
      // text/plain body keeps this a simple request, which Apps Script web apps accept cross-origin.
      const res=await fetch(UPLOAD_URL,{method:"POST",body:JSON.stringify({device:deviceId(),group:state.group.trim(),rows}),signal:ctl.signal});
      const out=await res.json();
      if(!out||!out.ok) throw new Error(out&&out.error||"refused");
      state.uploadedAt=new Date().toISOString();state.uploadedCsv=toCsv(state);save();render();
      toast("Uploaded: "+rows.length+" drills from "+state.group.trim()+".");
    }catch(e){
      infoBox("Upload failed","Your week was not sent. Check the connection and press Upload again."+($("#downloadBtn").hidden?"":" If it keeps failing, use Download CSV and send the file to the instructor."));
    }finally{
      clearTimeout(timer);uploading=false;$("#uploadBtn").disabled=false;$("#uploadLbl").textContent="Upload";
    }
  });

  // Download CSV (backup copy)
  function fileName(){const g=(state.group||"week").trim().replace(/[^\w\- ]+/g,"").replace(/\s+/g,"-").toLowerCase()||"week";return "microcycle-"+g+".csv";}
  let downloads=null;
  if(!EMBEDDED){$("#downloadBtn").hidden=false;}
  else if(window.claude&&typeof window.claude.use==="function"){
    window.claude.use("downloads").then(ns=>{if(ns){downloads=ns;$("#downloadBtn").hidden=false;}},()=>{});
  }
  $("#downloadBtn").addEventListener("click",async()=>{
    if(!weekTotals(state).drills){toast("The week is empty: add a drill first.");return;}
    const csv=toCsv(state);
    if(!downloads){
      const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:"text/csv"}));a.download=fileName();
      document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);return;
    }
    try{await downloads.save({filename:fileName(),data:csv});toast("CSV saved.");}
    catch(e){const c=e&&e.code;if(c==="declined")return;toast(c==="rate_limited"?"A save is already open. Try again in a moment.":"The file could not be saved here.");}
  });

  render();
})();
</script>
</body>
</html>
